name: Repository Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts
      - name: Validate repository and contracts
        run: npm run check
      - name: Validate cocktail knowledge source and structured version data
        run: npm run cocktails:check
      - name: Exercise cocktail knowledge, legacy data and real React selectors
        run: npm run test:cocktails
      - name: Execute private backend HTTP and real SQLite integration
        run: npm run test:backend
      - name: Two-device HTTP SQLite cloud sync integration
        run: npm run test:cloud
      - name: Exercise private offline recovery, quota and session lifecycle
        run: npm run test:hardening
      - name: Check migration gates
        run: npm run migration:status
  private-backend-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend bundler
        working-directory: apps/private-api
        run: npm install --no-audit --no-fund
      - name: Check Worker bundle without deploying
        working-directory: apps/private-api
        run: npm run deploy:check
  wechat-taro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Taro packages
        working-directory: apps/wechat
        run: npm install --no-audit --no-fund
      - name: Execute private journal TypeScript behavior tests
        run: npm run test:journal
      - name: Execute React journal form and global action tests
        run: npm run test:quick-ui
      - name: Exercise private journal views with real React and repository
        run: npm run test:journal-views
      - name: Exercise WeChat authentication and React account state
        run: npm run test:auth
      - name: Exercise private cloud sync React UI states
        run: npm run test:cloud-ui
      - name: Strict TypeScript check for journal and WeChat adapter
        run: apps/wechat/node_modules/.bin/tsc --noEmit -p tsconfig.journal.json
      - name: Compile WeChat mini program
        working-directory: apps/wechat
        run: npm run build:weapp
      - name: Check WeChat output
        run: test -f apps/wechat/dist/app.json
      - name: Check native action bar and both quick record routes
        run: |
          test -f apps/wechat/dist/custom-tab-bar/index.js
          test -f apps/wechat/dist/pages/journal-drink/index.js
          test -f apps/wechat/dist/pages/journal-visit/index.js
          test -f apps/wechat/dist/pages/journal-timeline/index.js
          test -f apps/wechat/dist/pages/journal-footprints/index.js
          test -f apps/wechat/dist/pages/journal-cocktails/index.js
          test -f apps/wechat/dist/pages/journal-drink-detail/index.js
          test -f apps/wechat/dist/pages/journal-visit-detail/index.js
          test -f apps/wechat/dist/pages/cocktail-detail/index.js
          test -f apps/wechat/dist/pages/recipe-variant/index.js

